name: Publish PEO test site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:edge && node tests/edge.mjs
      - run: pnpm build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify protected API
        run: |
          status=$(curl --silent --show-error --max-time 60 --output /tmp/peo-health --write-out '%{http_code}' https://ncisftxvcuwubfufsjbr.supabase.co/functions/v1/peo-api/health)
          test "$status" = 401
          status=$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X OPTIONS -H 'Origin: https://elio-chen0322.github.io' -H 'Access-Control-Request-Method: GET' https://ncisftxvcuwubfufsjbr.supabase.co/functions/v1/peo-api/health)
          test "$status" = 204
